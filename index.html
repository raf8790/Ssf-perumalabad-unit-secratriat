
<!DOCTYPE html>
<html lang="ml">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#07111f">

  <title>UNIT SECRETARIAT 2027-28 | SSF PERUMALABAD UNIT</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #07111f;
      font-family: Arial, sans-serif;
    }

    .app-frame {
      display: block;
      width: 100%;
      height: 100%;
      height: 100dvh;
      border: none;
      background: #07111f;
    }

    #loading {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      background: #07111f;
      color: #10b981;
      z-index: 2;
      transition: opacity 0.4s ease;
    }

    .loader {
      width: 40px;
      height: 40px;
      border: 4px solid #17372f;
      border-top-color: #10b981;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .loading-text {
      color: #ffffff;
      font-size: 14px;
      text-align: center;
      line-height: 1.8;
    }
  </style>
</head>

<body>

  <div id="loading">
    <div class="loader"></div>
    <strong>UNIT SECRETARIAT 2027-28</strong>
    <div class="loading-text">
      SSF PERUMALABAD UNIT<br>
      Please Wait...
    </div>
  </div>

  <iframe
    id="appFrame"
    class="app-frame"
    src="https://script.google.com/macros/s/AKfycbzMQOLTqvil9IO7x2d5J7yTTWFPlQ53VU2fjaYjEIffM5uQ_Wg0uoSzPExezPUdIoAe_w/exec"
    title="SSF Perumalabad Unit Secretariat 2027-28"
    allow="fullscreen"
    allowfullscreen>
  </iframe>

  <script>
    const frame = document.getElementById("appFrame");
    const loading = document.getElementById("loading");

    frame.addEventListener("load", function () {
      loading.style.opacity = "0";

      setTimeout(function () {
        loading.style.display = "none";
      }, 400);
    });
  </script>

</body>
</html>
